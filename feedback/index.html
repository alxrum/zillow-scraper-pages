<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Help us improve Zillow Scraper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6.5' fill='%23e8a33b'/%3E%3Cpath d='M4.8 11.2 12 5.4l7.2 5.8' fill='none' stroke='%232b2723' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 10.3v6.4m-2.7-2.6L12 16.8l2.7-2.7' fill='none' stroke='%232b2723' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M6.6 19.2h10.8' fill='none' stroke='%232b2723' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cloud.umami.is/script.js" data-website-id="328e350f-b770-4529-9500-92b514123a6c"></script>
<style>
  :root { --bg: #1b1815; --card: #24201c; --line: #3a342d; --fg: #f3ede4; --muted: #b6ab9c; --accent: #e8a33b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 "Instrument Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .shell { max-width: 780px; margin: 0 auto; padding: 48px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .mark { width: 40px; height: 40px; flex: none; }
  .brand { font-weight: 600; font-size: 18px; }
  h1 { font-size: 36px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; }
  .lead { color: var(--muted); font-size: 18px; margin: 0 0 28px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 12px; }
  label.reason { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  label.reason:hover { border-color: #5a5045; }
  input[type=radio] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
  textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #1f1c18; color: var(--fg); font: inherit; }
  textarea::placeholder { color: #8a8073; }
  button { justify-self: start; padding: 12px 22px; border: 0; border-radius: 10px; background: var(--accent); color: #2b2723; font: 600 16px/1 inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .thanks { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .thanks b { display: block; font-size: 20px; margin-bottom: 4px; }
  label.q { font-weight: 600; }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { h1 { font-size: 28px; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6.5" fill="#e8a33b"/><path d="M4.8 11.2 12 5.4l7.2 5.8" fill="none" stroke="#2b2723" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10.3v6.4m-2.7-2.6L12 16.8l2.7-2.7" fill="none" stroke="#2b2723" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 19.2h10.8" fill="none" stroke="#2b2723" stroke-width="2.1" stroke-linecap="round"/></svg>
    <span class="brand">Zillow Scraper</span>
  </header>

  <h1>Help us improve Zillow Scraper</h1>
  <p class="lead">Thanks for the honest rating. Tell us what should be better — it takes half a minute.</p>

  <form id="feedback">
    <label class="q" for="details">What should be better?</label>
    <textarea id="details" name="details" maxlength="5000" placeholder="What did you expect, and what happened instead?"></textarea>
    <button type="submit" id="send" disabled>Send feedback</button>
  </form>
  <div class="thanks" id="thanks" role="status"><b>Thank you. Every answer counts.</b></div>

  <footer>
    <a href="https://alxrum.github.io/zillow-scraper-privacy/">Privacy</a>
    <a href="https://github.com/alxrum/zillow-scraper-pages/issues">Report a problem</a>
  </footer>
</div>
<script>
// Google-форма «Zillow Scraper — feedback»: сюда ведут кнопка Report на экране
// ошибки разбора и оценка 1–3 звезды в попапе. Заполняется из pre-filled link:
// FORM_ID — из .../forms/d/e/<FORM_ID>/viewform, ENTRY_DETAILS — из entry.<число>.
// Пока пусто — страница благодарит, ничего не отправляя.
const FORM_ID = '1FAIpQLSeXcjZajEZ-Rcy6468fz9k7VMkKz6wSqatCn8u5HADFDWwKgg';
const ENTRY_DETAILS = 'entry.700270996';

// Экран ошибки передаёт адрес страницы и код ошибки в параметрах — показываем
// их человеку, чтобы он видел, что именно уходит, и дописываем к тексту.
const qs = new URLSearchParams(location.search);
const контекст = [qs.get('code'), qs.get('url')].filter(Boolean).join(' · ');
if (контекст) {
  const p = document.createElement('p');
  p.className = 'lead';
  p.style.fontSize = '15px';
  p.textContent = контекст;
  document.querySelector('form').before(p);
}

const form = document.getElementById('feedback');
const send = document.getElementById('send');
const details = document.getElementById('details');
details.addEventListener('input', () => { send.disabled = !details.value.trim(); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = details.value.trim();
  if (!text) return; // пустой текст не отправляется никогда
  send.disabled = true;
  if (FORM_ID && ENTRY_DETAILS) {
    const body = new URLSearchParams();
    body.set(ENTRY_DETAILS, контекст ? text + '\n\n' + контекст : text);
    try { await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, { method: 'POST', mode: 'no-cors', body }); } catch (err) { /* ответ всё равно поблагодарён */ }
  }
  form.style.display = 'none';
  document.getElementById('thanks').style.display = 'block';
});
</script>
</body>
</html>
